name: Build firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  telemetry-protocol-test:
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm@sha256:ca4978c179533772d3a77296bc628f8a3ae1ed75ee1cc8b411570f9810fd821e
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test telemetry protocol encoding
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Imodules/zmk-key-telemetry/include \
            modules/zmk-key-telemetry/src/protocol.c \
            modules/zmk-key-telemetry/tests/test_protocol.c \
            -o "${RUNNER_TEMP}/test_protocol"
          "${RUNNER_TEMP}/test_protocol"

  build:
    needs: telemetry-protocol-test
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm@sha256:ca4978c179533772d3a77296bc628f8a3ae1ed75ee1cc8b411570f9810fd821e
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: corne_left
          - board: nice_nano_v2
            shield: corne_right
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize dependencies
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build ${{ matrix.shield }}
        run: |
          west build -s zmk/app -d .build/${{ matrix.shield }} -b "${{ matrix.board }}" -- \
            -DSHIELD="${{ matrix.shield }}" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modules/zmk-key-telemetry"

      - name: Verify telemetry placement
        run: |
          if [ "${{ matrix.shield }}" = corne_left ]; then
            grep -q '^CONFIG_ZMK_KEY_TELEMETRY=y$' .build/${{ matrix.shield }}/zephyr/.config
            grep -q 'key_telemetry_service' .build/${{ matrix.shield }}/zephyr/zmk.map
          else
            ! grep -q '^CONFIG_ZMK_KEY_TELEMETRY=y$' .build/${{ matrix.shield }}/zephyr/.config
            ! grep -q 'key_telemetry_service' .build/${{ matrix.shield }}/zephyr/zmk.map
          fi

      - name: Stage artifact
        run: |
          mkdir artifacts
          cp .build/${{ matrix.shield }}/zephyr/zmk.uf2 \
            artifacts/${{ matrix.shield }}-${{ matrix.board }}-zmk.uf2

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-${{ matrix.shield }}-${{ matrix.board }}
          path: artifacts

  merge:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Merge firmware artifacts
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
