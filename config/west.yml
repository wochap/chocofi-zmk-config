manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: wochap
      url-base: https://github.com/wochap

  projects:
    - name: zmk
      remote: wochap
      # v0.3-branch-fork with synchronous effective HID modifier snapshots.
      revision: a301f6d562bd67f18e496402f8cf6c87326b05b2
      path: zmk
      import:
        file: app/west.yml
        # Replace ZMK's symbolic Zephyr revision with the immutable project below.
        name-blocklist:
          - zephyr

    - name: zephyr
      remote: zmkfirmware
      # ZMK's Zephyr v3.5.0+zmk-fixes release line.
      revision: dacab4875df72109b96cc8977547a0dc04875bcd
      path: zephyr
      import:
        # Keep the module selection used by the pinned ZMK v0.3.0 manifest.
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

  self:
    path: config
