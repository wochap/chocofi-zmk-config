manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    - name: zmk
      remote: zmkfirmware
      # Official ZMK v0.3.0.
      revision: edf5c0814fd3ea202e43aad2d68fd32e882a518c
      path: zmk
      import:
        file: app/west.yml
        # Replace ZMK's symbolic Zephyr revision with the immutable project below.
        name-blocklist:
          - zephyr

    - name: zephyr
      remote: zmkfirmware
      # ZMK's Zephyr v3.5.0+zmk-fixes release line.
      revision: dacab4875df72109b96cc8977547a0dc04875bcd
      path: zephyr
      import:
        # Keep the module selection used by the pinned ZMK v0.3.0 manifest.
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

  self:
    path: config
